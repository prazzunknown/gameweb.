
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>GameWeb - Tangkap Koin</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🪙 Tangkap Koin</h1>
        <p>Kumpulkan koin sebanyak mungkin!</p>

        <div class="score">
            Skor: <span id="score">0</span>
        </div>

        <div id="game">
            <div id="coin">🪙</div>
            <div id="player">🧑</div>
        </div>

        <div class="controls">
            <button id="left">⬅️</button>
            <button id="jump">⬆️</button>
            <button id="right">➡️</button>
        </div>

        <button id="restart">Mulai Ulang</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
